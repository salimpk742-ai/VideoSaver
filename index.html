<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#2563eb">

<title>VideoSaver - Video Downloader</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 30px 18px 60px;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 34px;
}

.header p {
  margin: 0;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.input-row {
  display: flex;
  gap: 10px;
}

#videoUrl {
  flex: 1;
  min-width: 0;
  height: 52px;
  padding: 0 16px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

#videoUrl:focus {
  border-color: #2563eb;
}

#downloadBtn {
  height: 52px;
  padding: 0 22px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#downloadBtn:disabled {
  opacity: .6;
}

.message {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  display: none;
  font-size: 14px;
}

.message.show {
  display: block;
}

.message.error {
  background: #fef2f2;
  color: #991b1b;
}

.message.info {
  background: #eff6ff;
  color: #1e40af;
}

.message.success {
  background: #ecfdf5;
  color: #065f46;
}

.result {
  display: none;
  margin-top: 24px;
}

.result.show {
  display: block;
}

.preview {
  display: flex;
  gap: 16px;
  margin-bottom: 22px;
}

.thumbnail {
  width: 180px;
  height: 105px;
  object-fit: cover;
  border-radius: 12px;
  flex-shrink: 0;
}

.title {
  margin: 0 0 8px;
  font-size: 19px;
  line-height: 1.35;
}

.meta {
  margin: 5px 0;
  color: #6b7280;
  font-size: 14px;
}

.links-title {
  margin: 20px 0 10px;
  font-size: 17px;
  font-weight: bold;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.download-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 54px;
  padding: 10px 14px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: #fafafa;
  color: #111827;
  cursor: pointer;
  touch-action: manipulation;
}

.download-link:hover {
  background: #f3f4f6;
}

.quality {
  font-weight: bold;
}

.format {
  color: #6b7280;
  font-size: 13px;
  margin-left: 5px;
}

.download-action {
  padding: 9px 14px;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

.download-link.loading {
  opacity: .65;
  pointer-events: none;
}

.empty {
  padding: 15px;
  background: #fff7ed;
  color: #9a3412;
  border-radius: 10px;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #9ca3af;
  font-size: 13px;
}

@media (max-width: 600px) {

  .container {
    padding: 20px 12px 40px;
  }

  .header h1 {
    font-size: 28px;
  }

  .card {
    padding: 16px;
  }

  .input-row {
    flex-direction: column;
  }

  #videoUrl,
  #downloadBtn {
    width: 100%;
  }

  .preview {
    flex-direction: column;
  }

  .thumbnail {
    width: 100%;
    height: auto;
    max-height: 250px;
  }

  .download-link {
    min-height: 58px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>VideoSaver</h1>
    <p>Download videos from supported social platforms</p>
  </div>

  <div class="card">

    <div class="input-row">

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste video URL here..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >

      <button
        id="downloadBtn"
        type="button"
      >
        Get Video
      </button>

    </div>

    <div id="message" class="message"></div>

    <div id="result" class="result">

      <div class="preview">

        <img
          id="thumbnail"
          class="thumbnail"
          alt="Video thumbnail"
        >

        <div>

          <h2
            id="title"
            class="title"
          ></h2>

          <div
            id="author"
            class="meta"
          ></div>

          <div
            id="platform"
            class="meta"
          ></div>

          <div
            id="duration"
            class="meta"
          ></div>

        </div>

      </div>

      <div class="links-title">
        Available downloads
      </div>

      <div
        id="links"
        class="links"
      ></div>

    </div>

  </div>

  <div class="footer">
    VideoSaver
  </div>

</div>


<script>

const API_BASE =
  "https://video-saver-backend.vercel.app";


const videoUrl =
  document.getElementById("videoUrl");

const downloadBtn =
  document.getElementById("downloadBtn");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const thumbnail =
  document.getElementById("thumbnail");

const title =
  document.getElementById("title");

const author =
  document.getElementById("author");

const platform =
  document.getElementById("platform");

const duration =
  document.getElementById("duration");

const links =
  document.getElementById("links");


// ========================================
// MESSAGE
// ========================================

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message show " + type;

}


function hideMessage() {

  message.textContent = "";

  message.className = "message";

}


// ========================================
// RESET
// ========================================

function resetResult() {

  result.classList.remove("show");

  links.innerHTML = "";

  thumbnail.removeAttribute("src");

  title.textContent = "";

  author.textContent = "";

  platform.textContent = "";

  duration.textContent = "";

}


// ========================================
// DURATION
// ========================================

function formatDuration(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "";
  }

  seconds =
    Math.floor(Number(seconds));

  const minutes =
    Math.floor(seconds / 60);

  const remaining =
    seconds % 60;

  return (
    minutes +
    ":" +
    String(remaining).padStart(2, "0")
  );

}


// ========================================
// DOWNLOAD THROUGH OUR BACKEND
// ========================================

async function downloadVideo(item, button) {

  if (
    !item ||
    !item.url
  ) {

    showMessage(
      "This quality does not have a downloadable file.",
      "error"
    );

    return;

  }


  button.classList.add("loading");

  button.querySelector(
    ".download-action"
  ).textContent = "Preparing...";


  try {

    /*
     * IMPORTANT:
     *
     * We no longer send the user directly
     * to TikTok/Instagram/Facebook.
     *
     * Instead:
     *
     * Browser
     *    ↓
     * VideoSaver backend
     *    ↓
     * Social CDN
     */

    const proxyUrl =
      API_BASE +
      "/proxy?url=" +
      encodeURIComponent(
        item.url
      );


    /*
     * Navigate to OUR backend.
     *
     * The backend sends:
     *
     * Content-Disposition:
     * attachment
     *
     * so the browser should download it.
     */

    window.location.href =
      proxyUrl;


  } catch (error) {

    console.error(
      "Download error:",
      error
    );

    showMessage(
      "Unable to start the download.",
      "error"
    );

    button.classList.remove(
      "loading"
    );

    button.querySelector(
      ".download-action"
    ).textContent =
      "Download";

  }

}


// ========================================
// CREATE DOWNLOAD BUTTON
// ========================================

function createDownloadButton(item) {

  if (
    !item ||
    !item.url ||
    typeof item.url !== "string" ||
    item.url.trim() === ""
  ) {

    return null;

  }


  const button =
    document.createElement("div");


  button.className =
    "download-link";


  const left =
    document.createElement("div");


  const quality =
    document.createElement("span");

  quality.className =
    "quality";

  quality.textContent =
    item.quality ||
    "Video";


  const format =
    document.createElement("span");

  format.className =
    "format";

  format.textContent =
    item.format
      ? "• " + item.format
      : "";


  left.appendChild(
    quality
  );

  left.appendChild(
    format
  );


  const action =
    document.createElement("span");


  action.className =
    "download-action";


  action.textContent =
    "Download";


  button.appendChild(
    left
  );

  button.appendChild(
    action
  );


  button.addEventListener(
    "click",
    function() {

      downloadVideo(
        item,
        button
      );

    }
  );


  return button;

}


// ========================================
// GET VIDEO
// ========================================

async function getVideo() {

  const url =
    videoUrl.value.trim();


  if (!url) {

    showMessage(
      "Please paste a video URL first.",
      "error"
    );

    return;

  }


  if (
    !/^https?:\/\//i.test(url)
  ) {

    showMessage(
      "Please enter a valid video URL.",
      "error"
    );

    return;

  }


  resetResult();

  hideMessage();


  downloadBtn.disabled =
    true;

  downloadBtn.textContent =
    "Checking...";


  try {

    const endpoint =
      API_BASE +
      "/download?url=" +
      encodeURIComponent(
        url
      );


    const response =
      await fetch(
        endpoint,
        {
          method: "GET",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      data.success === false
    ) {

      showMessage(
        data.error ||
        "Unable to process this video.",
        "error"
      );

      return;

    }


    title.textContent =
      data.title ||
      "Video";


    if (data.author) {

      author.textContent =
        "By " +
        data.author;

    }


    if (data.platform) {

      platform.textContent =
        "Platform: " +
        data.platform;

    }


    if (data.duration) {

      duration.textContent =
        "Duration: " +
        formatDuration(
          data.duration
        );

    }


    if (data.thumbnail) {

      thumbnail.src =
        data.thumbnail;

      thumbnail.onerror =
        function() {

          thumbnail.style.display =
            "none";

        };

    } else {

      thumbnail.style.display =
        "none";

    }


    const downloadLinks =
      Array.isArray(
        data.downloadLinks
      )
        ? data.downloadLinks
        : [];


    const validLinks =
      downloadLinks.filter(
        item =>
          item &&
          typeof item.url ===
            "string" &&
          item.url.trim() !== ""
      );


    if (
      validLinks.length === 0
    ) {

      result.classList.add(
        "show"
      );


      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "empty";


      empty.textContent =
        "The video was found, but no downloadable file was provided.";

      links.appendChild(
        empty
      );


      return;

    }


    validLinks.forEach(
      item => {

        const button =
          createDownloadButton(
            item
          );


        if (button) {

          links.appendChild(
            button
          );

        }

      }
    );


    result.classList.add(
      "show"
    );


    showMessage(
      "Video found. Choose a quality below.",
      "success"
    );


    setTimeout(
      function() {

        result.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      },
      100
    );


  } catch (error) {

    console.error(
      "VideoSaver error:",
      error
    );


    showMessage(
      "Could not connect to the VideoSaver server. Please try again.",
      "error"
    );


  } finally {

    downloadBtn.disabled =
      false;

    downloadBtn.textContent =
      "Get Video";

  }

}


// ========================================
// BUTTON
// ========================================

downloadBtn.addEventListener(
  "click",
  getVideo
);


// ========================================
// ENTER KEY
// ========================================

videoUrl.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      getVideo();

    }

  }
);

</script>

</body>
</html>
