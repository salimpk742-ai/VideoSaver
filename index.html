<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VideoSaver - Download Videos</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #videoUrl {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #videoUrl:focus {
      border-color: #2563eb;
    }

    #downloadBtn {
      height: 52px;
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    #downloadBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #991b1b;
    }

    .message.info {
      background: #eff6ff;
      color: #1e40af;
    }

    .result {
      display: none;
      margin-top: 24px;
    }

    .result.show {
      display: block;
    }

    .preview {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .thumbnail {
      width: 180px;
      height: 105px;
      object-fit: cover;
      border-radius: 12px;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .details {
      min-width: 0;
    }

    .title {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 700;
      word-break: break-word;
    }

    .meta {
      margin: 4px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .links-title {
      margin: 20px 0 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .download-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 50px;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
      text-decoration: none;
      color: #111827;
      transition: 0.15s;
    }

    .download-link:hover {
      background: #f3f4f6;
    }

    .quality {
      font-weight: 700;
    }

    .format {
      color: #6b7280;
      font-size: 13px;
      margin-left: 5px;
    }

    .download-action {
      padding: 9px 14px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      padding: 15px;
      background: #fff7ed;
      color: #9a3412;
      border-radius: 10px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 20px 12px 40px;
      }

      .header h1 {
        font-size: 28px;
      }

      .card {
        padding: 16px;
        border-radius: 14px;
      }

      .input-row {
        flex-direction: column;
      }

      #videoUrl {
        width: 100%;
        height: 52px;
      }

      #downloadBtn {
        width: 100%;
      }

      .preview {
        flex-direction: column;
      }

      .thumbnail {
        width: 100%;
        height: auto;
        max-height: 230px;
      }

      .download-link {
        min-height: 58px;
        padding: 10px 12px;
      }

      .download-action {
        padding: 10px 12px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <div class="header">

      <h1>VideoSaver</h1>

      <p>
        Download videos from supported social platforms
      </p>

    </div>


    <div class="card">

      <div class="input-row">

        <input
          id="videoUrl"
          type="url"
          placeholder="Paste video URL here..."
          autocomplete="off"
        >

        <button
          id="downloadBtn"
          type="button"
        >
          Download
        </button>

      </div>


      <div
        id="message"
        class="message"
      ></div>


      <div
        id="result"
        class="result"
      >

        <div class="preview">

          <img
            id="thumbnail"
            class="thumbnail"
            alt="Video thumbnail"
          >

          <div class="details">

            <h2
              id="title"
              class="title"
            ></h2>

            <div
              id="author"
              class="meta"
            ></div>

            <div
              id="platform"
              class="meta"
            ></div>

            <div
              id="duration"
              class="meta"
            ></div>

          </div>

        </div>


        <div class="links-title">
          Available downloads
        </div>

        <div
          id="links"
          class="links"
        ></div>

      </div>

    </div>


    <div class="footer">
      VideoSaver
    </div>

  </div>


  <script>

    // ================================
    // BACKEND
    // ================================

    const API_BASE =
      "https://video-saver-backend.vercel.app";


    // ================================
    // ELEMENTS
    // ================================

    const formUrl =
      document.getElementById("videoUrl");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");

    const thumbnail =
      document.getElementById("thumbnail");

    const title =
      document.getElementById("title");

    const author =
      document.getElementById("author");

    const platform =
      document.getElementById("platform");

    const duration =
      document.getElementById("duration");

    const links =
      document.getElementById("links");


    // ================================
    // MESSAGE
    // ================================

    function showMessage(
      text,
      type = "info"
    ) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    // ================================
    // RESET
    // ================================

    function resetResult() {

      result.classList.remove("show");

      links.innerHTML = "";

      thumbnail.removeAttribute("src");

      title.textContent = "";

      author.textContent = "";

      platform.textContent = "";

      duration.textContent = "";

    }


    // ================================
    // FORMAT DURATION
    // ================================

    function formatDuration(seconds) {

      if (
        !seconds ||
        isNaN(seconds)
      ) {
        return "";
      }

      seconds =
        Math.floor(Number(seconds));

      const minutes =
        Math.floor(seconds / 60);

      const remaining =
        seconds % 60;

      return (
        minutes +
        ":" +
        String(remaining).padStart(2, "0")
      );

    }


    // ================================
    // CREATE DOWNLOAD LINK
    // ================================

    function createDownloadLink(item) {

      if (
        !item ||
        !item.url ||
        typeof item.url !== "string"
      ) {
        return null;
      }


      const link =
        document.createElement("a");

      link.className =
        "download-link";

      link.href =
        item.url;

      /*
        Normal browser navigation.

        This is more reliable on mobile than
        window.open() or popup windows.
      */

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";


      const left =
        document.createElement("div");


      const quality =
        document.createElement("span");

      quality.className =
        "quality";

      quality.textContent =
        item.quality ||
        "Download";


      const format =
        document.createElement("span");

      format.className =
        "format";

      format.textContent =
        item.format
          ? "• " + item.format
          : "";


      left.appendChild(
        quality
      );

      left.appendChild(
        format
      );


      const action =
        document.createElement("span");

      action.className =
        "download-action";

      action.textContent =
        "Download";


      link.appendChild(
        left
      );

      link.appendChild(
        action
      );


      return link;

    }


    // ================================
    // FETCH VIDEO
    // ================================

    async function fetchVideo() {

      const url =
        formUrl.value.trim();


      if (!url) {

        showMessage(
          "Please paste a video URL.",
          "error"
        );

        return;

      }


      resetResult();

      hideMessage();


      downloadBtn.disabled =
        true;

      downloadBtn.textContent =
        "Checking...";


      try {

        const endpoint =
          API_BASE +
          "/download?url=" +
          encodeURIComponent(url);


        const response =
          await fetch(endpoint);


        const data =
          await response.json();


        if (
          !response.ok ||
          data.success === false
        ) {

          let errorText =
            "Unable to process this video.";


          if (
            data.error &&
            typeof data.error === "string"
          ) {
            errorText =
              data.error;
          }


          if (
            data.reelGrabResponse &&
            data.reelGrabResponse.error
          ) {

            if (
              typeof data.reelGrabResponse.error === "string"
            ) {

              errorText =
                data.reelGrabResponse.error;

            } else if (
              data.reelGrabResponse.error.message
            ) {

              errorText =
                data.reelGrabResponse.error.message;

            }

          }


          showMessage(
            errorText,
            "error"
          );

          return;

        }


        // ============================
        // METADATA
        // ============================

        title.textContent =
          data.title ||
          "Video";


        if (data.author) {

          author.textContent =
            "By " + data.author;

        }


        if (data.platform) {

          platform.textContent =
            "Platform: " +
            data.platform;

        }


        if (data.duration) {

          duration.textContent =
            "Duration: " +
            formatDuration(
              data.duration
            );

        }


        if (data.thumbnail) {

          thumbnail.src =
            data.thumbnail;

        } else {

          thumbnail.style.display =
            "none";

        }


        // ============================
        // DOWNLOAD LINKS
        // ============================

        const downloadLinks =
          Array.isArray(
            data.downloadLinks
          )
            ? data.downloadLinks
            : [];


        const validLinks =
          downloadLinks.filter(
            item =>
              item &&
              typeof item.url === "string" &&
              item.url.trim() !== ""
          );


        if (
          validLinks.length === 0
        ) {

          result.classList.add(
            "show"
          );

          links.innerHTML = "";

          const empty =
            document.createElement("div");

          empty.className =
            "empty";

          empty.textContent =
            "The video was found, but this source did not provide a downloadable file. Try another public video.";

          links.appendChild(
            empty
          );

          return;

        }


        // ============================
        // SHOW LINKS
        // ============================

        validLinks.forEach(
          item => {

            const link =
              createDownloadLink(
                item
              );

            if (link) {

              links.appendChild(
                link
              );

            }

          }
        );


        result.classList.add(
          "show"
        );


      } catch (error) {

        console.error(
          error
        );

        showMessage(
          "Could not connect to the VideoSaver server. Please try again.",
          "error"
        );

      } finally {

        downloadBtn.disabled =
          false;

        downloadBtn.textContent =
          "Download";

      }

    }


    // ================================
    // BUTTON
    // ================================

    downloadBtn.addEventListener(
      "click",
      fetchVideo
    );


    // ================================
    // ENTER KEY
    // ================================

    formUrl.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          fetchVideo();

        }

      }
    );

  </script>

</body>
</html>
