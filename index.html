<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoSaver - Video Downloader</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 30px 16px 60px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 34px;
}

.header p {
  margin: 0;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.input-row {
  display: flex;
  gap: 10px;
}

#videoUrl {
  flex: 1;
  min-width: 0;
  height: 52px;
  padding: 0 16px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

#downloadBtn {
  height: 52px;
  padding: 0 22px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#downloadBtn:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
}

.message.show {
  display: block;
}

.message.error {
  background: #fef2f2;
  color: #991b1b;
}

.message.info {
  background: #eff6ff;
  color: #1e40af;
}

.message.success {
  background: #ecfdf5;
  color: #065f46;
}

.result {
  display: none;
  margin-top: 25px;
}

.result.show {
  display: block;
}

.preview {
  display: flex;
  gap: 16px;
  margin-bottom: 22px;
}

.thumbnail {
  width: 180px;
  height: 105px;
  object-fit: cover;
  border-radius: 12px;
}

.title {
  margin: 0 0 8px;
  font-size: 19px;
}

.meta {
  margin: 5px 0;
  color: #6b7280;
  font-size: 14px;
}

.links-title {
  margin: 20px 0 10px;
  font-weight: bold;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.download-link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 55px;
  padding: 10px 14px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: #fafafa;
}

.quality {
  font-weight: bold;
}

.format {
  color: #6b7280;
  font-size: 13px;
}

.download-action {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.download-action:disabled {
  opacity: .6;
  cursor: wait;
}

.progress {
  margin-top: 15px;
  display: none;
}

.progress.show {
  display: block;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

.progress-inner {
  width: 0%;
  height: 100%;
  background: #2563eb;
  transition: width .2s;
}

.progress-text {
  margin-top: 7px;
  font-size: 13px;
  color: #6b7280;
}

@media (max-width: 600px) {

  .container {
    padding: 20px 12px 40px;
  }

  .input-row {
    flex-direction: column;
  }

  #videoUrl,
  #downloadBtn {
    width: 100%;
  }

  .preview {
    flex-direction: column;
  }

  .thumbnail {
    width: 100%;
    height: auto;
    max-height: 250px;
  }

  .download-link {
    min-height: 62px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>VideoSaver</h1>
    <p>Download videos from supported social platforms</p>
  </div>

  <div class="card">

    <div class="input-row">

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste video URL here..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >

      <button
        id="downloadBtn"
        type="button"
      >
        Get Video
      </button>

    </div>

    <div
      id="message"
      class="message"
    ></div>

    <div
      id="result"
      class="result"
    >

      <div class="preview">

        <img
          id="thumbnail"
          class="thumbnail"
          alt="Video thumbnail"
        >

        <div>

          <h2
            id="title"
            class="title"
          ></h2>

          <div
            id="author"
            class="meta"
          ></div>

          <div
            id="platform"
            class="meta"
          ></div>

          <div
            id="duration"
            class="meta"
          ></div>

        </div>

      </div>

      <div class="links-title">
        Available downloads
      </div>

      <div
        id="links"
        class="links"
      ></div>

      <div
        id="progress"
        class="progress"
      >

        <div class="progress-bar">

          <div
            id="progressInner"
            class="progress-inner"
          ></div>

        </div>

        <div
          id="progressText"
          class="progress-text"
        >
          Preparing download...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

const API_BASE =
  "https://video-saver-backend.vercel.app";


const videoUrl =
  document.getElementById("videoUrl");

const downloadBtn =
  document.getElementById("downloadBtn");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const thumbnail =
  document.getElementById("thumbnail");

const title =
  document.getElementById("title");

const author =
  document.getElementById("author");

const platform =
  document.getElementById("platform");

const duration =
  document.getElementById("duration");

const links =
  document.getElementById("links");

const progress =
  document.getElementById("progress");

const progressInner =
  document.getElementById("progressInner");

const progressText =
  document.getElementById("progressText");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message show " + type;

}


function resetResult() {

  result.classList.remove("show");

  links.innerHTML = "";

  thumbnail.removeAttribute("src");

  title.textContent = "";

  author.textContent = "";

  platform.textContent = "";

  duration.textContent = "";

  progress.classList.remove("show");

}


function formatDuration(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "";
  }

  seconds =
    Math.floor(Number(seconds));

  const minutes =
    Math.floor(seconds / 60);

  const remaining =
    seconds % 60;

  return (
    minutes +
    ":" +
    String(remaining).padStart(2, "0")
  );

}


// ==========================================
// DOWNLOAD USING FETCH + BLOB
// ==========================================

async function downloadFile(item, button) {

  if (!item || !item.url) {

    showMessage(
      "This quality has no downloadable file.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Downloading...";


  progress.classList.add("show");

  progressInner.style.width =
    "0%";

  progressText.textContent =
    "Connecting to video server...";


  try {

    const proxyUrl =
      API_BASE +
      "/proxy?url=" +
      encodeURIComponent(
        item.url
      );


    /*
     * IMPORTANT:
     *
     * We use fetch().
     *
     * We DO NOT use:
     *
     * window.location.href
     *
     * window.open()
     * 
     * or a normal <a href>.
     */


    const response =
      await fetch(
        proxyUrl,
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      let errorMessage =
        "Download server returned an error.";

      try {

        const errorData =
          await response.json();

        if (errorData.error) {
          errorMessage =
            errorData.error;
        }

      } catch {}

      throw new Error(
        errorMessage
      );

    }


    /*
     * Read the response as a Blob.
     */

    const contentLength =
      response.headers.get(
        "content-length"
      );


    const total =
      contentLength
        ? parseInt(
            contentLength,
            10
          )
        : 0;


    if (!response.body) {

      /*
       * Fallback if streaming is unavailable.
       */

      const blob =
        await response.blob();

      saveBlob(
        blob,
        item
      );

      return;
    }


    const reader =
      response.body.getReader();


    const chunks = [];

    let received = 0;


    while (true) {

      const {
        done,
        value
      } =
        await reader.read();


      if (done) {
        break;
      }


      chunks.push(
        value
      );


      received +=
        value.length;


      if (total > 0) {

        const percent =
          Math.round(
            (received / total) *
            100
          );


        progressInner.style.width =
          percent + "%";


        progressText.textContent =
          "Downloading... " +
          percent +
          "%";

      } else {

        progressText.textContent =
          "Downloading... " +
          formatBytes(
            received
          );

      }

    }


    progressInner.style.width =
      "100%";


    progressText.textContent =
      "Preparing file...";


    /*
     * Combine chunks.
     */

    const blob =
      new Blob(
        chunks,
        {
          type:
            response.headers.get(
              "content-type"
            ) ||
            "video/mp4"
        }
      );


    saveBlob(
      blob,
      item
    );


    progressText.textContent =
      "Download complete";


    showMessage(
      "Download completed successfully.",
      "success"
    );


  } catch (error) {

    console.error(
      "Download error:",
      error
    );


    progress.classList.remove(
      "show"
    );


    showMessage(
      error.message ||
      "Unable to download this video.",
      "error"
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "Download";

  }

}


// ==========================================
// SAVE BLOB
// ==========================================

function saveBlob(blob, item) {

  const blobUrl =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    blobUrl;


  link.download =
    makeFilename(
      item
    );


  link.style.display =
    "none";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        blobUrl
      );

    },
    60000
  );

}


// ==========================================
// FILE NAME
// ==========================================

function makeFilename(item) {

  let quality =
    item.quality ||
    "video";


  quality =
    quality.replace(
      /[^a-z0-9_-]/gi,
      "_"
    );


  let extension =
    item.format ||
    "mp4";


  extension =
    extension
      .replace(
        /[^a-z0-9]/gi,
        ""
      )
      .toLowerCase();


  if (!extension) {
    extension = "mp4";
  }


  return (
    "VideoSaver_" +
    quality +
    "." +
    extension
  );

}


// ==========================================
// FORMAT BYTES
// ==========================================

function formatBytes(bytes) {

  if (!bytes) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    (
      bytes /
      Math.pow(
        1024,
        index
      )
    ).toFixed(1) +
    " " +
    units[index]
  );

}


// ==========================================
// CREATE DOWNLOAD BUTTON
// ==========================================

function createDownloadButton(item) {

  if (
    !item ||
    !item.url ||
    typeof item.url !== "string"
  ) {

    return null;
  }


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "download-link";


  const left =
    document.createElement(
      "div"
    );


  const quality =
    document.createElement(
      "span"
    );


  quality.className =
    "quality";


  quality.textContent =
    item.quality ||
    "Video";


  const format =
    document.createElement(
      "span"
    );


  format.className =
    "format";


  format.textContent =
    item.format
      ? " • " + item.format
      : "";


  left.appendChild(
    quality
  );

  left.appendChild(
    format
  );


  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "download-action";


  button.textContent =
    "Download";


  button.addEventListener(
    "click",
    function() {

      downloadFile(
        item,
        button
      );

    }
  );


  row.appendChild(
    left
  );

  row.appendChild(
    button
  );


  return row;

}


// ==========================================
// GET VIDEO
// ==========================================

async function getVideo() {

  const url =
    videoUrl.value.trim();


  if (!url) {

    showMessage(
      "Please paste a video URL first.",
      "error"
    );

    return;
  }


  resetResult();


  downloadBtn.disabled =
    true;

  downloadBtn.textContent =
    "Checking...";


  showMessage(
    "Checking video...",
    "info"
  );


  try {

    const endpoint =
      API_BASE +
      "/download?url=" +
      encodeURIComponent(
        url
      );


    const response =
      await fetch(
        endpoint,
        {
          method: "GET",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      data.success === false
    ) {

      throw new Error(
        data.error ||
        "Unable to process this video."
      );

    }


    title.textContent =
      data.title ||
      "Video";


    author.textContent =
      data.author
        ? "By " + data.author
        : "";


    platform.textContent =
      data.platform
        ? "Platform: " +
          data.platform
        : "";


    duration.textContent =
      data.duration
        ? "Duration: " +
          formatDuration(
            data.duration
          )
        : "";


    if (data.thumbnail) {

      thumbnail.style.display =
        "block";

      thumbnail.src =
        data.thumbnail;

    } else {

      thumbnail.style.display =
        "none";

    }


    const downloadLinks =
      Array.isArray(
        data.downloadLinks
      )
        ? data.downloadLinks
        : [];


    const validLinks =
      downloadLinks.filter(
        item =>
          item &&
          typeof item.url ===
            "string" &&
          item.url.trim() !== ""
      );


    if (
      validLinks.length === 0
    ) {

      throw new Error(
        "No downloadable video files were returned."
      );

    }


    validLinks.forEach(
      item => {

        const row =
          createDownloadButton(
            item
          );


        if (row) {

          links.appendChild(
            row
          );

        }

      }
    );


    result.classList.add(
      "show"
    );


    showMessage(
      "Video found. Choose a quality.",
      "success"
    );


  } catch (error) {

    console.error(
      "Video lookup error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to process this video.",
      "error"
    );


  } finally {

    downloadBtn.disabled =
      false;

    downloadBtn.textContent =
      "Get Video";

  }

}


// ==========================================
// EVENTS
// ==========================================

downloadBtn.addEventListener(
  "click",
  getVideo
);


videoUrl.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      getVideo();

    }

  }
);

</script>

</body>
</html>
